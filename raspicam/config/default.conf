# raspicam: USBカメラ -> DevKit HDMI 表示 設定ファイル

# --- USBカメラ ---
# auto: uvcvideo の Video Capture ノード(番号最小)を自動選択。USB再接続で番号が
# 変わるため固定値より auto を推奨。複数台あるときは /dev/videoN を指定する。
# 2026-10-18 時点の接続: /dev/video96 "IMX219 NoIR UVC Camera: UVC Cam"
#   = Raspberry Pi Zero W (192.168.88.55) + IMX219 NoIR、configfs UVC gadget (pi/README.md)
camera_device=auto
# yuyv / mjpeg。現在の Pi 側設定は YUYV のみ提供 (MJPEG は Pi Zero のソフトJPEGで
# 3.4fps・強圧縮だったため外した)。mjpeg は別のUSBカメラ用に残してある。
capture_format=yuyv
# Pi 側のモード: 640x360 @15/10/5、640x480 @10/5 (どちらもセンサー 1640x1232 全域ビニング)
#   640x480@10 : 全画角 水平62°x垂直49°。実測 8.6fps (7.1-9.4、USB isoc 取りこぼしで10未満)
#   640x360@15 : 水平62°x垂直35° (上下を切る)。実測 15fps 安定
# 物体探索は画角優先で 640x480@10。制御ループの速さが要るときは 640x360@15。
capture_width=640
capture_height=480
capture_fps=10
# none / rotate-180 / horizontal-flip / vertical-flip
camera_flip=none
# true: 画面下にデバイス名・解像度・fps・時刻を重ねる
overlay=true
# 0 = 無限に表示し続ける (スモークテストは --frames 150 など)
frames=0

# --- DevKit本体のHDMI出力 (hdmi_out.py) ---
# 実行中だけ lightdm(デスクトップ)を止めて kmssink で全画面表示し、終了時に再開する。
# SIGKILL で落とすと lightdm が止まったままになる: sudo systemctl start lightdm
hdmi_enabled=true
# DevKitのGPUは SiliconMotion smifb (自動検出は失敗するので明示が必要)
hdmi_driver=smifb
# 0 = モニタの現在のモード(現状 1920x1080)。カメラ映像はアスペクト比を保って拡大。
hdmi_width=0
hdmi_height=0

# --- UDP配信 (任意。H.264/RTP over UDP) ---
# 受信側: gst-launch-1.0 udpsrc port=9000 caps="application/x-rtp,media=video,encoding-name=H264,payload=96" \
#           ! rtph264depay ! h264parse ! avdec_h264 ! videoconvert ! autovideosink sync=false
udp_enabled=false
udp_host=10.42.0.1
udp_port=9000
bitrate_kbps=2000

# --- YOLO物体認識 (DevKit MLA) ---
# false: 認識せずカメラ映像だけ表示 (--no-yolo と同じ)
yolo_enabled=true
# yolo26m bf16: MLA推論 約29ms (demo-neat/apps/usb-camera-yolo26m 実測)。カメラは15fpsなので
# 律速はカメラ側で、軽量の yolo26n にしてもfpsは上がらない -> 精度優先で m。
# 比較用: model_path=assets/yolo26n-det-bf16-mla_tess-b1.tar.gz
# (dkが ./ で始まる値を書き換えるので、先頭に ./ を付けない。アプリのディレクトリ基準)
model_path=assets/yolo26m-det-bf16-mla_tess-b1.tar.gz
model_width=640
model_height=640
# 実シーンでスコア分布を見て決める(print_detections=true で全検出を確認できる)
score_threshold=0.35
nms_iou=0.50
top_k=100
num_classes=80
# モデルRunの入力キュー深さ(OverflowPolicy.Block)。2でMLAとCPU処理が重なる。
model_queue_depth=2
# 表示するCOCOクラス名(カンマ区切り)。空 = 全80クラス。例: classes=cup,bottle,cell phone
classes=
# true: 毎フレームの検出結果(クラス・スコア・座標)を標準出力に出す(ロボット連携の確認用)
print_detections=false
